when@dev:
    zenstruck_foundry:
        faker:
            locale: '%app.locale%'
            # seed: 5170
        persistence:
            flush_once: true
        make_factory:
            add_hints: false
            default_namespace: 'App\Fixtures\Factory'
        make_story:
            default_namespace: 'App\Fixtures\Story'
        orm:
            reset:
                mode: migrate
                
    # If you use the `make:factory --test` command, you may need to uncomment the following.
    # See https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#generate
    #services:
    #    App\Tests\Factory\:
    #        resource: '%kernel.project_dir%/tests/Factory/'
    #        autowire: true
    #        autoconfigure: true

when@test: 
    zenstruck_foundry:
        faker:
            locale: '%app.locale%'
            # seed: 709584
        persistence:
            flush_once: true
        global_state:
            - 'App\Fixtures\Story\TestStory'
        orm:
            reset:
                connections:
                    - default
                    - account
                entity_managers:
                    - default
                    - account
                mode: schema
