security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        
    providers:
        mainick_keycloak_user_provider:
            id: Mainick\KeycloakClientBundle\Security\User\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|build)/
            security: false
        main:
            pattern: ^/
            lazy: true
            provider: mainick_keycloak_user_provider
            entry_point: Mainick\KeycloakClientBundle\Security\EntryPoint\KeycloakAuthenticationEntryPoint
            custom_authenticator:
                - Mainick\KeycloakClientBundle\Security\Authenticator\KeycloakAuthenticator
            logout:
                path: mainick_keycloak_security_auth_logout
            access_denied_handler: App\Security\AccessDeniedHandler
                
    access_control:
        - { path: /auth/keycloak/connect, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@dev:
    security:
        providers:
            keycloak_mock_user_provider:
                id: App\Tests\Mock\KeycloakMockUserProvider
        firewalls:
            main: # Allow to create and connect with local dummy user
                entry_point: App\Tests\Mock\KeycloakMockEntryPoint
                provider: keycloak_mock_user_provider

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        providers:
            keycloak_mock_user_provider:
                id: App\Tests\Mock\KeycloakMockUserProvider
        firewalls:
            main: # Allow to create and connect with local dummy user
                entry_point: App\Tests\Mock\KeycloakMockEntryPoint
                provider: keycloak_mock_user_provider

