vich_uploader:
    db_driver: orm
    mappings:
        attachments:
            uri_prefix: false
            upload_destination: '%kernel.project_dir%/var/uploads/attachments'
            namer: Vich\UploaderBundle\Naming\SlugNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

