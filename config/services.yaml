# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.name: '%env(string:APP_NAME)%'
    app.env: '%env(string:APP_ENV)%'
    app.currency: '%env(string:APP_CURRENCY)%'
    app.locale: '%env(string:APP_LOCALE)%'
    app.request_timeout: '%env(int:APP_REQUEST_TIMEOUT)%'
    app.batch_size: '%env(int:APP_BATCH_SIZE)%'
    app.steam_api_key: '%env(string:APP_STEAM_API_KEY)%'
    app.discord_webhook_url: '%env(string:APP_DISCORD_WEBHOOK_URL)%'
    app.discord_webhook_ellipsis: '%env(string:APP_DISCORD_WEBHOOK_ELLIPSIS)%'
    app.default_limit: '%env(int:APP_DEFAULT_LIMIT)%'
    app.max_limit: '%env(int:APP_MAX_LIMIT)%'
    app.home_game_limit: '%env(int:APP_HOME_GAME_LIMIT)%'
    app.home_review_limit: '%env(int:APP_HOME_REVIEW_LIMIT)%'
    app.autocompletion_limit: '%env(int:APP_AUTOCOMPLETION_LIMIT)%'
    app.autocompletion_min_length: '%env(int:APP_AUTOCOMPLETION_MIN_LENGTH)%'
    app.html_validation: '%env(bool:APP_HTML_VALIDATION)%'
    app.enable_prefetch: '%env(bool:APP_ENABLE_PREFETCH)%'
    app.enable_autoload: '%env(bool:APP_ENABLE_AUTOLOAD)%'
    app.mock_api: '%env(bool:APP_MOCK_API)%'
    app.mock_keycloak: '%env(bool:APP_MOCK_KEYCLOAK)%'
    app.hub_url: '%env(string:HUB_BASE_URL)%'
    app.iam_url: '%env(string:IAM_BASE_URL)%'

imports:
    - { resource: 'version.yaml' }

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: '../src/'

    Symfony\Component\Dotenv\Command\DotenvDumpCommand: ~
    Symfony\UX\StimulusBundle\Helper\StimulusHelper: '@stimulus.helper'
    
    Vich\UploaderBundle\Naming\SlugNamer:
        arguments:
            $service: '@App\Repository\AttachmentRepository'
            $method: findOneByName

    App\Command\SteamScrapV1Command:
        arguments:
            $requestTimeout: '%app.request_timeout%'
            $batchSize: '%app.batch_size%'

    App\Command\SteamScrapV2Command:
        arguments:
            $requestTimeout: '%app.request_timeout%'
            $batchSize: '%app.batch_size%'
            $steamApiKey: '%app.steam_api_key%'

    App\Command\DiscordNotifyCommand:
        arguments:
            $locale: '%app.locale%'
            $requestTimeout: '%app.request_timeout%'
            $discordWebhookUrl: '%app.discord_webhook_url%'
            $discordWebhookEllipsis: '%app.discord_webhook_ellipsis%'
            
    App\Form\:
        resource: '../src/Form'
        tags: ['form.type']
        arguments:
            $htmlValidation: '%app.html_validation%'

    App\Form\GameType:
        arguments:
            $htmlValidation: '%app.html_validation%'
            $currency: '%app.currency%'

    App\Service\AutocompletionManager:
        arguments:
            $autocompletionLimit: '%app.autocompletion_limit%'
            $autocompletionMinLength: '%app.autocompletion_min_length%'

    App\Service\AutocompletionHelper:
        arguments:
            $autocompletionMinLength: '%app.autocompletion_min_length%'

    App\Service\SteamSearchHelper:
        arguments:
            $requestTimeout: '%app.request_timeout%'
            $locale: '%app.locale%'
            $currency: '%app.currency%'

    App\Service\QueryParamHelper:
        arguments:
            $defaultLimit: '%app.default_limit%'
            $maxLimit: '%app.max_limit%'

    App\Validator\ImageUrlValidator:
        arguments:
            $requestTimeout: '%app.request_timeout%'

when@dev: &services_dev
    parameters:
        discord.dir: '%kernel.project_dir%/var/discord/%kernel.environment%'

    services:
        App\Tests\Mock\HttpClientFactory: ~ 

        Symfony\Contracts\HttpClient\HttpClientInterface:
            factory: ['App\Tests\Mock\HttpClientFactory', 'create']
            arguments:
                $enable: '%app.mock_api%'
                $discordDir: '%discord.dir%'
                $filesystem: '@Symfony\Component\Filesystem\Filesystem'

        App\Tests\Mock\KeycloakMockEntryPoint:
            decorates: 'Mainick\KeycloakClientBundle\Security\EntryPoint\KeycloakAuthenticationEntryPoint'
            autowire: true
            autoconfigure: true

        App\Tests\Mock\KeycloakMockUserProvider:
            autowire: true
            autoconfigure: true

        App\Tests\Mock\KeycloakMockManager:
            decorates: 'App\Service\KeycloakManager'
            autowire: true
            autoconfigure: true

when@test: *services_dev